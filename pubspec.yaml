name: semester_os
description: "Offline-first study planner for Android and iOS."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.13.5
  # Pinned toolchain. CI reads this line (flutter-version-file) and tool/check.sh enforces it.
  flutter: 3.47.7

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  drift: ^2.35.2
  sqlite3: ^3.7.0
  path_provider: ^2.1.6
  path: ^1.9.1
  clock: ^1.1.3
  uuid: ^4.6.0
  intl: ^0.20.3
  fl_chart: ^1.2.0
  semester_scheduler:
    path: packages/semester_scheduler

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.1
  build_runner: ^2.16.2

flutter:
  uses-material-design: true
