name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format, analyze, test, debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Reads the exact Flutter version pinned in pubspec.yaml (environment.flutter).
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Packages
        run: |
          flutter pub get
          (cd packages/semester_scheduler && dart pub get)

      - name: Generate Drift code
        run: dart run build_runner build

      - name: Format, analyze, tests
        run: ./tool/check.sh

      - name: Debug APK
        run: flutter build apk --debug
